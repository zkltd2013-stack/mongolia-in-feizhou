<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <linearGradient id="pagebg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f6f0e2"/>
      <stop offset="100%" stop-color="#efe7d7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1600" fill="url(#pagebg)"/>
  <rect x="90" y="100" width="1020" height="1400" fill="none" stroke="#b99264" stroke-width="2"/>
  <text x="600" y="220" text-anchor="middle" font-size="34" font-family="Georgia, serif" fill="#3f2d2b">《蒙古在费州：寄错的大钱袋》</text>
  <line x1="300" y1="270" x2="900" y2="270" stroke="#b99264" stroke-width="1.5"/>

  <text x="600" y="420" text-anchor="middle" font-size="28" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#3a3131">目录</text>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#352e2c" font-size="24">
    <text x="290" y="520">一、寄错的大钱袋</text>
    <text x="290" y="575">二、善后工程</text>
    <text x="290" y="630">三、沉默的旁证</text>
    <text x="290" y="685">四、黑市回声</text>
    <text x="290" y="740">五、真相被切割</text>
  </g>

  <g font-family="Georgia, serif" fill="#3f2d2b" font-size="26">
    <text x="600" y="960" text-anchor="middle">Chapter One</text>
  </g>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#433738" font-size="30">
    <text x="290" y="1060">“别告诉他。”</text>
    <text x="290" y="1125">一张便签落在桌上，像一场未开口的翻供。</text>
    <text x="290" y="1195">现实与记忆在同一页里交错，</text>
    <text x="290" y="1260">故事从一张照片开始，延伸成一场城市的问责。</text>
  </g>

  <text x="600" y="1470" text-anchor="middle" font-size="26" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#4a3f3a">作者：联总</text>
</svg>
