<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1b1f29"/>
      <stop offset="100%" stop-color="#4a3327"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#d9b36d"/>
      <stop offset="100%" stop-color="#f2d7a4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1800" fill="url(#bg)"/>
  <rect x="120" y="120" width="960" height="1560" fill="none" stroke="#d9b36d" stroke-width="4"/>
  <rect x="170" y="170" width="860" height="1460" fill="none" stroke="#f0d2a4" stroke-opacity="0.8" stroke-width="1.5"/>

  <rect x="200" y="210" width="800" height="8" fill="url(#accent)"/>
  <text x="600" y="420" text-anchor="middle" font-size="72" font-family="Georgia, serif" fill="#f5efe4" letter-spacing="12">蒙古在费州</text>
  <text x="600" y="570" text-anchor="middle" font-size="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#f2d7a4" letter-spacing="10">寄错的大钱袋</text>
  <line x1="350" y1="640" x2="850" y2="640" stroke="#d9b36d" stroke-width="2"/>

  <text x="600" y="920" text-anchor="middle" font-size="26" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#f5efe4" letter-spacing="6">作者</text>
  <text x="600" y="980" text-anchor="middle" font-size="58" font-family="Georgia, serif" fill="#f7efe5" letter-spacing="4">联总</text>

  <g opacity="0.92">
    <rect x="250" y="1120" width="700" height="300" fill="#efe3cc" fill-opacity="0.08" stroke="#dcc596" stroke-opacity="0.45"/>
    <text x="600" y="1190" text-anchor="middle" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#e8d4a6" letter-spacing="4">真相被切割，记忆被寄存</text>
    <text x="600" y="1260" text-anchor="middle" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#f5efe4" letter-spacing="3">A 版 · 极简文字 + 色块</text>
    <text x="600" y="1330" text-anchor="middle" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#e4d5b2" letter-spacing="2">5.5 × 8.5 · 纸色米黄 · 沉稳装帧</text>
  </g>

  <rect x="200" y="1515" width="800" height="8" fill="url(#accent)"/>
</svg>
